<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@300;400;500&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  html, body { margin:0; padding:0; background:oklch(0.968 0.004 85); }
  * { box-sizing:border-box; }
  a { color:oklch(0.22 0.006 80); text-decoration:none; }
  a:hover { color:oklch(0.22 0.006 80); }
  @keyframes fadeIn { from { opacity:0; } to { opacity:1; } }
  @keyframes slideIn { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:none; } }
</style>
</helmet>

<div style="min-height:100vh; display:flex; flex-direction:column; background:oklch(0.968 0.004 85); font-family:'Hanken Grotesk',system-ui,sans-serif; color:oklch(0.22 0.006 80);">

  <header style="position:relative; z-index:40; flex:0 0 auto; display:flex; align-items:center; justify-content:space-between; gap:24px; padding:clamp(16px, 2.8vw, 38px) clamp(18px, 3.4vw, 46px);">
    <a href="#" style="font-size:clamp(13px, 1.2vw, 16px); font-weight:300; letter-spacing:0.38em; text-transform:uppercase; white-space:nowrap;">Einphix</a>

    <sc-if value="{{ isFull }}" hint-placeholder-val="{{ true }}">
      <nav style="display:flex; align-items:center; gap:clamp(16px, 2vw, 28px);">
        <div onMouseEnter="{{ enterWork }}" onMouseLeave="{{ leaveMenu }}" style="position:relative; display:flex; align-items:center;">
          <a href="#" style="font-size:12px; letter-spacing:0.2em; text-transform:uppercase; white-space:nowrap; text-decoration:underline; text-underline-offset:6px; text-decoration-thickness:1px;">Work</a>
          <sc-if value="{{ workOpen }}" hint-placeholder-val="{{ false }}">
            <div style="position:absolute; top:calc(100% + 18px); left:50%; transform:translateX(-50%); z-index:40; display:flex; flex-direction:column; gap:12px; padding:20px 26px; background:oklch(0.995 0.002 85); box-shadow:0 22px 48px -24px rgba(0,0,0,0.3), 0 0 0 1px oklch(0 0 0 / 0.05); animation:fadeIn 160ms ease both;">
              <span style="position:absolute; top:-5px; left:50%; width:10px; height:10px; transform:translateX(-50%) rotate(45deg); background:oklch(0.995 0.002 85);"></span>
              <a href="#" style="font-size:12px; letter-spacing:0.2em; white-space:nowrap; color:oklch(0.22 0.008 265); transition:color 160ms;" style-hover="color:oklch(0.2 0.006 80);">2025 – 2024</a>
              <a href="#" style="font-size:12px; letter-spacing:0.2em; white-space:nowrap; color:oklch(0.5 0.008 265); transition:color 160ms;" style-hover="color:oklch(0.2 0.006 80);">2023 – 2022</a>
              <a href="#" style="font-size:12px; letter-spacing:0.2em; white-space:nowrap; color:oklch(0.62 0.008 265); transition:color 160ms;" style-hover="color:oklch(0.2 0.006 80);">2021 – 2020</a>
              <a href="#" style="font-size:12px; letter-spacing:0.2em; white-space:nowrap; color:oklch(0.7 0.008 265); transition:color 160ms;" style-hover="color:oklch(0.2 0.006 80);">2019 – 2018</a>
              <a href="#" style="font-size:12px; letter-spacing:0.2em; white-space:nowrap; color:oklch(0.76 0.008 265); transition:color 160ms;" style-hover="color:oklch(0.2 0.006 80);">Before 2017</a>
            </div>
          </sc-if>
        </div>
        <div onMouseEnter="{{ enterSeries }}" onMouseLeave="{{ leaveMenu }}" style="position:relative; display:flex; align-items:center;">
          <a href="#" style="font-size:12px; letter-spacing:0.2em; text-transform:uppercase; white-space:nowrap; opacity:0.66; transition:opacity 180ms;" style-hover="opacity:1;">Series</a>
          <sc-if value="{{ seriesOpen }}" hint-placeholder-val="{{ false }}">
            <div style="position:absolute; top:calc(100% + 18px); left:50%; transform:translateX(-50%); z-index:40; display:flex; flex-direction:column; gap:12px; padding:20px 26px; background:oklch(0.995 0.002 85); box-shadow:0 22px 48px -24px rgba(0,0,0,0.3), 0 0 0 1px oklch(0 0 0 / 0.05); animation:fadeIn 160ms ease both;">
              <span style="position:absolute; top:-5px; left:50%; width:10px; height:10px; transform:translateX(-50%) rotate(45deg); background:oklch(0.995 0.002 85);"></span>
              <a href="#" style="font-size:12px; letter-spacing:0.2em; white-space:nowrap; color:oklch(0.22 0.008 265); transition:color 160ms;" style-hover="color:oklch(0.2 0.006 80);">Furry Forces</a>
            </div>
          </sc-if>
        </div>
        <a href="#" style="font-size:12px; letter-spacing:0.2em; text-transform:uppercase; white-space:nowrap; opacity:0.66; transition:opacity 180ms;" style-hover="opacity:1;">Sketches</a>
        <a href="#" style="font-size:12px; letter-spacing:0.2em; text-transform:uppercase; white-space:nowrap; opacity:0.66; transition:opacity 180ms;" style-hover="opacity:1;">About</a>
        <a href="#" style="font-size:12px; letter-spacing:0.2em; text-transform:uppercase; white-space:nowrap; opacity:0.66; transition:opacity 180ms;" style-hover="opacity:1;">Commission</a>
        <a href="#" style="font-size:12px; letter-spacing:0.2em; text-transform:uppercase; white-space:nowrap; opacity:0.66; transition:opacity 180ms;" style-hover="opacity:1;">Class</a>
        <span style="display:flex; align-items:center; gap:15px; margin-left:8px;">
          <a href="#" title="Instagram" style="display:flex; opacity:0.7; transition:opacity 180ms;" style-hover="opacity:1;"><img src="https://cdn.simpleicons.org/instagram/1a1a1a" alt="Instagram" width="16" height="16" style="display:block;"></a>
          <a href="#" title="rednote" style="display:flex; align-items:center; justify-content:center; width:16px; height:16px; border:1px solid oklch(0.55 0.006 80); border-radius:50%; font-size:9px; line-height:1; color:oklch(0.26 0.006 80); opacity:0.8; transition:opacity 180ms;" style-hover="opacity:1;">小</a>
          <a href="#" title="YouTube" style="display:flex; opacity:0.7; transition:opacity 180ms;" style-hover="opacity:1;"><img src="https://cdn.simpleicons.org/youtube/1a1a1a" alt="YouTube" width="16" height="16" style="display:block;"></a>
          <a href="#" title="bilibili" style="display:flex; opacity:0.7; transition:opacity 180ms;" style-hover="opacity:1;"><img src="https://cdn.simpleicons.org/bilibili/1a1a1a" alt="bilibili" width="16" height="16" style="display:block;"></a>
        </span>
      </nav>
    </sc-if>

    <sc-if value="{{ isCompact }}" hint-placeholder-val="{{ false }}">
      <button type="button" onClick="{{ toggleNav }}" aria-label="Menu" style="display:flex; flex-direction:column; align-items:flex-end; gap:4px; width:44px; height:44px; justify-content:center; margin-right:-10px; background:transparent; border:none; cursor:pointer;">
        <span style="display:block; width:18px; height:1px; background:oklch(0.22 0.006 80);"></span>
        <span style="display:block; width:18px; height:1px; background:oklch(0.22 0.006 80);"></span>
        <span style="display:block; width:18px; height:1px; background:oklch(0.22 0.006 80);"></span>
      </button>
    </sc-if>
  </header>

  <sc-if value="{{ navOpen }}" hint-placeholder-val="{{ false }}">
    <nav style="flex:0 0 auto; display:flex; flex-direction:column; padding:4px clamp(20px, 3.4vw, 46px) 24px; border-top:1px solid oklch(0.9 0.005 85); animation:slideIn 200ms ease both;">
      <button type="button" onClick="{{ toggleWorkSection }}" style="display:flex; align-items:center; justify-content:space-between; gap:12px; width:100%; padding:16px 0; background:transparent; border:none; border-bottom:1px solid oklch(0.9 0.005 85); font-family:'Hanken Grotesk',sans-serif; font-size:13px; letter-spacing:0.2em; text-transform:uppercase; color:oklch(0.22 0.006 80); text-align:left; cursor:pointer;">
        <span>Work</span>
        <span style="font-size:16px; line-height:1; opacity:0.5;">+</span>
      </button>
      <sc-if value="{{ workExpanded }}" hint-placeholder-val="{{ false }}">
        <div style="display:flex; flex-direction:column; gap:14px; padding:16px 0 18px 2px; border-bottom:1px solid oklch(0.9 0.005 85);">
          <a href="#" style="font-size:13px; letter-spacing:0.2em; color:oklch(0.22 0.008 265);">2025 – 2024</a>
          <a href="#" style="font-size:13px; letter-spacing:0.2em; color:oklch(0.5 0.008 265);">2023 – 2022</a>
          <a href="#" style="font-size:13px; letter-spacing:0.2em; color:oklch(0.62 0.008 265);">2021 – 2020</a>
          <a href="#" style="font-size:13px; letter-spacing:0.2em; color:oklch(0.7 0.008 265);">2019 – 2018</a>
          <a href="#" style="font-size:13px; letter-spacing:0.2em; color:oklch(0.76 0.008 265);">Before 2017</a>
        </div>
      </sc-if>
      <button type="button" onClick="{{ toggleSeriesSection }}" style="display:flex; align-items:center; justify-content:space-between; gap:12px; width:100%; padding:16px 0; background:transparent; border:none; border-bottom:1px solid oklch(0.9 0.005 85); font-family:'Hanken Grotesk',sans-serif; font-size:13px; letter-spacing:0.2em; text-transform:uppercase; color:oklch(0.22 0.006 80); text-align:left; cursor:pointer;">
        <span>Series</span>
        <span style="font-size:16px; line-height:1; opacity:0.5;">+</span>
      </button>
      <sc-if value="{{ seriesExpanded }}" hint-placeholder-val="{{ false }}">
        <div style="display:flex; flex-direction:column; gap:14px; padding:16px 0 18px 2px; border-bottom:1px solid oklch(0.9 0.005 85);">
          <a href="#" style="font-size:13px; letter-spacing:0.2em; color:oklch(0.22 0.008 265);">Furry Forces</a>
        </div>
      </sc-if>
      <a href="#" style="display:block; padding:16px 0; border-bottom:1px solid oklch(0.9 0.005 85); font-size:13px; letter-spacing:0.2em; text-transform:uppercase;">Sketches</a>
      <a href="#" style="display:block; padding:16px 0; border-bottom:1px solid oklch(0.9 0.005 85); font-size:13px; letter-spacing:0.2em; text-transform:uppercase;">About</a>
      <a href="#" style="display:block; padding:16px 0; border-bottom:1px solid oklch(0.9 0.005 85); font-size:13px; letter-spacing:0.2em; text-transform:uppercase;">Commission</a>
      <a href="#" style="display:block; padding:16px 0; border-bottom:1px solid oklch(0.9 0.005 85); font-size:13px; letter-spacing:0.2em; text-transform:uppercase;">Class</a>
      <span style="display:flex; align-items:center; gap:22px; padding-top:24px;">
        <a href="#" title="Instagram" style="display:flex; opacity:0.7;"><img src="https://cdn.simpleicons.org/instagram/1a1a1a" alt="Instagram" width="18" height="18" style="display:block;"></a>
        <a href="#" title="rednote" style="display:flex; align-items:center; justify-content:center; width:18px; height:18px; border:1px solid oklch(0.55 0.006 80); border-radius:50%; font-size:11px; line-height:1; color:oklch(0.26 0.006 80); opacity:0.8; transition:opacity 180ms;" style-hover="opacity:1;">小</a>
        <a href="#" title="YouTube" style="display:flex; opacity:0.7;"><img src="https://cdn.simpleicons.org/youtube/1a1a1a" alt="YouTube" width="18" height="18" style="display:block;"></a>
        <a href="#" title="bilibili" style="display:flex; opacity:0.7;"><img src="https://cdn.simpleicons.org/bilibili/1a1a1a" alt="bilibili" width="18" height="18" style="display:block;"></a>
      </span>
    </nav>
  </sc-if>

  <main style="flex:1 1 auto; min-height:0; display:flex; justify-content:center; align-items:flex-start; padding:clamp(10px, 2vw, 28px) clamp(20px, 3.4vw, 46px) clamp(28px, 4vw, 52px);">
    <div style="display:grid; grid-template-columns:1fr; width:100%; max-width:620px;">

      <figure style="grid-column:1; grid-row:1; margin:0; display:flex; flex-direction:column; opacity:{{ s0 }}; pointer-events:none; transition:opacity 900ms cubic-bezier(0.4,0,0.2,1);">
        <div style="width:100%; aspect-ratio:3 / 2; overflow:hidden; background:oklch(0.9 0.005 85); box-shadow:0 40px 80px -40px rgba(0,0,0,0.45);">
          <img src="uploads/IMG_63510.jpg" alt="Oil painting of three rabbits in tactical gear" style="width:100%; height:100%; object-fit:cover; display:block;">
        </div>
        <figcaption style="margin-top:18px; display:flex; flex-direction:column; gap:5px;">
          <span style="font-size:15px; letter-spacing:0.01em;">Untitled (Three)</span>
          <span style="font-size:15px; letter-spacing:0.01em;">2024, oil on canvas, 35 x 24 in / 90 x 60 cm</span>
        </figcaption>
      </figure>

      <figure style="grid-column:1; grid-row:1; margin:0; display:flex; flex-direction:column; opacity:{{ s1 }}; pointer-events:none; transition:opacity 900ms cubic-bezier(0.4,0,0.2,1);">
        <div style="width:100%; aspect-ratio:1 / 1; overflow:hidden; background:oklch(0.9 0.005 85); box-shadow:0 40px 80px -40px rgba(0,0,0,0.45);">
          <img src="uploads/A4-8x8-cloude-F.png" alt="Oil painting of power lines against a cloud at dusk" style="width:100%; height:100%; object-fit:cover; display:block;">
        </div>
        <figcaption style="margin-top:18px; display:flex; flex-direction:column; gap:5px;">
          <span style="font-size:15px; letter-spacing:0.01em;">Untitled (Wires)</span>
          <span style="font-size:15px; letter-spacing:0.01em;">2024, oil on canvas, 20 x 20 in / 51 x 51 cm</span>
        </figcaption>
      </figure>

      <figure style="grid-column:1; grid-row:1; margin:0; display:flex; flex-direction:column; opacity:{{ s2 }}; pointer-events:none; transition:opacity 900ms cubic-bezier(0.4,0,0.2,1);">
        <div style="width:100%; aspect-ratio:4 / 3; overflow:hidden; background:oklch(0.9 0.005 85); box-shadow:0 40px 80px -40px rgba(0,0,0,0.45);">
          <img src="uploads/A-blured.png" alt="Oil painting of Adélie penguins on ice" style="width:100%; height:100%; object-fit:cover; display:block;">
        </div>
        <figcaption style="margin-top:18px; display:flex; flex-direction:column; gap:5px;">
          <span style="font-size:15px; letter-spacing:0.01em;">Untitled (Adélie)</span>
          <span style="font-size:15px; letter-spacing:0.01em;">2024, oil on canvas, 16 x 12 in / 40 x 30 cm</span>
        </figcaption>
      </figure>

      <figure style="grid-column:1; grid-row:1; margin:0; display:flex; flex-direction:column; opacity:{{ s3 }}; pointer-events:none; transition:opacity 900ms cubic-bezier(0.4,0,0.2,1);">
        <div style="width:100%; aspect-ratio:3 / 2; overflow:hidden; display:flex; align-items:center; justify-content:center; background:repeating-linear-gradient(135deg, oklch(0.91 0.004 85) 0 11px, oklch(0.875 0.004 85) 11px 22px); box-shadow:0 40px 80px -40px rgba(0,0,0,0.3);">
          <span style="font-family:'JetBrains Mono',monospace; font-size:12px; letter-spacing:0.16em; text-transform:uppercase; color:oklch(0.48 0.006 80); background:oklch(0.968 0.004 85); padding:9px 14px;">artwork 04 — drop image</span>
        </div>
        <figcaption style="margin-top:18px; display:flex; flex-direction:column; gap:5px;">
          <span style="font-size:15px; letter-spacing:0.01em;">Daily study</span>
          <span style="font-size:15px; letter-spacing:0.01em;">year, gouache on paper, size</span>
        </figcaption>
      </figure>

    </div>
  </main>

</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;autoplaySeconds&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:5,&quot;min&quot;:0,&quot;max&quot;:12,&quot;unit&quot;:&quot;s&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Behavior&quot;},&quot;compactBreakpoint&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:900,&quot;min&quot;:600,&quot;max&quot;:1200,&quot;step&quot;:20,&quot;unit&quot;:&quot;px&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Behavior&quot;}}">
class Component extends DCLogic {
  state = { i: 0, menu: null, navOpen: false, section: null, compact: false };

  componentDidMount() {
    const secs = this.props.autoplaySeconds ?? 5;
    if (secs > 0) this.timer = setInterval(() => this.setState(s => ({ i: (s.i + 1) % 4 })), secs * 1000);
    this.measure = (w) => {
      const width = w || document.documentElement.clientWidth || window.innerWidth;
      const compact = width < (this.props.compactBreakpoint ?? 900);
      if (compact !== this.state.compact) this.setState({ compact, navOpen: false, menu: null });
    };
    this.onResize = () => this.measure();
    window.addEventListener("resize", this.onResize);
    if (window.ResizeObserver) {
      this.ro = new ResizeObserver((entries) => this.measure(entries[0].contentRect.width));
      this.ro.observe(document.documentElement);
    }
    this.measure();
    this.raf = requestAnimationFrame(() => this.measure());
  }

  componentWillUnmount() {
    clearInterval(this.timer);
    clearTimeout(this.menuTimer);
    window.removeEventListener("resize", this.onResize);
    if (this.ro) this.ro.disconnect();
    if (this.raf) cancelAnimationFrame(this.raf);
  }

  enter(k) { clearTimeout(this.menuTimer); this.setState({ menu: k }); }
  leave() { clearTimeout(this.menuTimer); this.menuTimer = setTimeout(() => this.setState({ menu: null }), 160); }

  renderVals() {
    const i = this.state.i;
    return {
      s0: i === 0 ? 1 : 0, s1: i === 1 ? 1 : 0, s2: i === 2 ? 1 : 0, s3: i === 3 ? 1 : 0,
      isFull: !this.state.compact,
      isCompact: this.state.compact,
      workOpen: this.state.menu === "work",
      seriesOpen: this.state.menu === "series",
      navOpen: this.state.navOpen,
      workExpanded: this.state.section === "work",
      seriesExpanded: this.state.section === "series",
      enterWork: () => this.enter("work"),
      enterSeries: () => this.enter("series"),
      leaveMenu: () => this.leave(),
      toggleNav: () => this.setState(st => ({ navOpen: !st.navOpen })),
      toggleWorkSection: () => this.setState(st => ({ section: st.section === "work" ? null : "work" })),
      toggleSeriesSection: () => this.setState(st => ({ section: st.section === "series" ? null : "series" }))
    };
  }
}

</script>
</body>
</html>
